version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burn-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///app/data/burn_after_reading.db
      - CORS_ORIGINS=https://${DOMAIN:-localhost}
      - HOST=0.0.0.0
      - PORT=8001
    volumes:
      - burn_db_data:/app/data
    security_opt:
      - "apparmor:unconfined"
    ports:
      - "8001:8001"
    networks:
      - burn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: burn-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api
    ports:
      - "3001:3000"
    networks:
      - burn-network
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - "apparmor:unconfined"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  burn-network:
    driver: bridge
    name: burn_after_reading_network

volumes:
  burn_db_data:
    driver: local