# This is a robust Nginx configuration for serving a Vue.js Single Page Application (SPA).

server {
    # Listen on port 80, the default port for HTTP inside the container.
    listen 80;

    # Set the root directory to where the Vue app's build files are located.
    root /usr/share/nginx/html;
    
    # The default file to serve is index.html.
    index index.html;

    # This location block is the key for SPA routing.
    # It tries to find a file matching the URI, then a directory,
    # and if both fail, it serves /index.html. This allows Vue Router
    # to handle the routing on the client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Gzip compression for better performance.
    # This reduces the size of the files sent from the server to the browser.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Optional: Set browser caching for static assets (images, CSS, JS).
    # This tells the browser to cache these files for 1 month, reducing load times on subsequent visits.
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js)$ {
      expires 1M;
      access_log off;
      add_header Cache-Control "public";
    }

    # Hide Nginx version information for security.
    server_tokens off;
} 