# This is a robust Nginx configuration for serving a Vue.js Single Page Application (SPA).

server {
    # Listen on port 3000, a non-standard port to avoid conflicts.
    listen 3000;

    # Set the root directory to where the Vue app's build files are located.
    root /usr/share/nginx/html;
    
    # The default file to serve is index.html.
    index index.html;

    # This is the crucial part for single-page applications.
    # It ensures that any request that doesn't match a file or directory
    # gets redirected to index.html, allowing Vue Router to handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide Nginx version for security.
    server_tokens off;
} 