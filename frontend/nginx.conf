server {
    listen 80;

    # Vue.js app's build files are served from here
    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing: all paths should lead to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Optional: Cache static assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js)$ {
      expires 1M;
      access_log off;
      add_header Cache-Control "public";
    }
} 